name: 发布每日 AI 情报

on:
  schedule:
    # GitHub Actions cron 使用 UTC；01:00 UTC = 中国时间 09:00。
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只生成并在日志预览，不发送 Telegram"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: aiqinbaozhan-daily-publisher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || vars.DRY_RUN || 'true' }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 运行单元测试
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-wqy-zenhei
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v

      - name: 生成并按配置发布
        run: python src/ai_news_bot.py

      - name: 保存当天深度 PDF（测试模式也可下载）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiqinbaozhan-deep-report-${{ github.run_id }}
          path: output/pdf/*.pdf
          if-no-files-found: ignore
          retention-days: 30
